<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Magic reading</title>
<style>
* {
	box-sizing: border-box;
}
html {
	margin: 0;
	height: 100%;
	background-color: black;
	color: white;
}
body {
	margin: 0;
	height: 100%;
}
table {
	border: 2px solid gray;
}
td {
}
input:focus
, button:focus
, textarea:focus {
	box-shadow: 0 0 10px 10px orange;
}
textarea {
	background-color: black;
	color: #00FF41;
}
#frame {
	background-color: black;
	color: #00FF41;
	box-shadow: 0 0 10px 10px orange;
}
</style>
</head>
<body>

<table width="100%" height="100%" align="center" style="">
	<tr id="step1">
		<!-- vamos a swapear el text area por el render area -->
		<td id="step1" height="95%">
			Este proyecto es para practicar lectura rápida, la idea la saque de un vendedor de cursos de lectura rápida y comento que se hacian este tipo de ejercicios:<br>
			<b>Copia el texto que quieres leer aquí y atizale al Play</b>
			<br>
			<br>
			<textarea id="txt1" style="width: 100%; height: 98%;">En un lugar de la Mancha, de cuyo nombre no quiero acordarme, no ha mucho tiempo que vivía un hidalgo de los de lanza en astillero, adarga antigua, rocín flaco y galgo corredor. Una olla de algo más vaca que carnero, salpicón las más noches, duelos y quebrantos los sábados, lantejas los viernes, algún palomino de añadidura los domingos, consumían las tres partes de su hacienda. El resto della concluían sayo de velarte, calzas de velludo para las fiestas, con sus pantuflos de lo mesmo, y los días de entresemana se honraba con su vellorí de lo más fino. Tenía en su casa una ama que pasaba de los cuarenta, y una sobrina que no llegaba a los veinte, y un mozo de campo y plaza, que así ensillaba el rocín como tomaba la podadera. Frisaba la edad de nuestro hidalgo con los cincuenta años; era de complexión recia, seco de carnes, enjuto de rostro, gran madrugador y amigo de la caza. Quieren decir que tenía el sobrenombre de Quijada, o Quesada, que en esto hay alguna diferencia en los autores que deste caso escriben; aunque por conjeturas verosímiles se deja entender que se llamaba Quijana. Pero esto importa poco a nuestro cuento: basta que en la narración dél no se salga un punto de la verdad.

Es, pues, de saber que este sobredicho hidalgo, los ratos que estaba ocioso, que eran los más del año, se daba a leer libros de caballerías, con tanta afición y gusto, que olvidó casi de todo punto el ejercicio de la caza, y aun la administración de su hacienda; y llegó a tanto su curiosidad y desatino en esto, que vendió muchas hanegas de tierra de sembradura para comprar libros de caballerías en que leer, y así, llevó a su casa todos cuantos pudo haber dellos; y de todos, ningunos le parecían tan bien como los que compuso el famoso Feliciano de Silva; porque la claridad de su prosa y aquellas entricadas razones suyas le parecían de perlas, y más cuando llegaba a leer aquellos requiebros y cartas de desafíos, donde en muchas partes hallaba escrito: «La razón de la sinrazón que a mi razón se hace, de tal manera mi razón enflaquece, que con razón me quejo de la vuestra fermosura». Y también cuando leía: «... los altos cielos que de vuestra divinidad divinamente con las estrellas os fortifican, y os hacen merecedora del merecimiento que merece la vuestra grandeza».</textarea>
		</td>
	</tr>
	<tr id="step2" style="display: none;">
		<td id="frame" height="95%" align="center" style="font-size: 36pt;">- STARTING -</td>
	</tr>
	<!-- los controles se van quedar fijos -->
	<tr id="controls">
		<td align="center">
			<button id="btnPlay" style="font-size: 20pt;">Play</button> |
			<button id="btnPause" style="font-size: 20pt;">Pause</button> |
			frame interval
			<input type="number" id="txtWaitTime" style="text-align: right; font-size: 14pt; width: 4em;" value="250">ms |
			min. characters per frame
			<input type="number" id="txtMinCharsPerFrame" style="text-align: right; font-size: 14pt; width: 3em;" value="1">ms |
			<button id="btnStop" style="font-size: 20pt;">Stop</button>
		</td>
	</tr>
</table>
</body>
<script>

// CONFIG VARIABLES
var min_chars_per_frame = 7
var wait_time

// STATE VARIABLES
var word_index
var pid
var state = 'zero'

function g(id){
	return document.getElementById(id);
}

var step1 = g('step1')
var step2 = g('step2')
var txt = g('txt1')
var btn = g('btnPlay')
var btnPause = g('btnPause')
var btnStop = g('btnStop')
var frame = g('frame')
var txtWaitTime = g('txtWaitTime')



function render_word(){
	var msg
	if ( word_index < word_A.length ){
		msg = word_A[ word_index ]; word_index++;
		while( msg.length < min_chars_per_frame && word_index < word_A.length ){
			msg += ' ' + word_A[ word_index ]; word_index++;
		}
		frame.innerHTML = msg
	} else {
		if ( pid ) {
			clearInterval(pid); pid = 0
			//console.log('removed frame loop because of END')
			state = 'zero'
		}
		frame.innerHTML = '- THE END -'
		txt.value = ''
		step2.style.display = 'none'
		step1.style.display = null
		txt.focus()
	}
}

function read_wait_time(){
	//console.log('read_wait_time:')
	var wait_time_wanted = parseInt( txtWaitTime.value )
	if ( wait_time_wanted >= 20 && wait_time_wanted <= 20000 ){
		wait_time = wait_time_wanted
		if ( state == 'playing' ){
			if ( pid ){
				clearInterval(pid)
				//console.log('removed frame loop because of change in wait time')
				setup_frame_loop()
			}
		}
	}
	txtWaitTime.value = wait_time
	//console.log('wait_time='+wait_time)
}

function read_min_chars_per_frame(){
	//console.log('read_min_chars_per_frame:')
	var wanted = parseInt( txtMinCharsPerFrame.value )
	if ( wanted > 0 && wanted <= 40 ){
		min_chars_per_frame = wanted
	} else {
		min_chars_per_frame = 8
	}
	txtMinCharsPerFrame.value = min_chars_per_frame
	//console.log('min_chars_per_frame=' + min_chars_per_frame)
}

function setup_frame_loop(){
	//console.log('setup_frame_loop: render_word and setting up frame loop every ' + wait_time)
	render_word()
	pid = setInterval( function(){
		render_word()
	}, wait_time )
	state = 'playing'
}

function play(){
	if ( state == 'zero' ){
		//console.log('play: zero state, inicializando ... ')
		read_wait_time()
		read_min_chars_per_frame()
		// split text by space
		tt = txt.value
		tt = tt.replaceAll( "\n", ' ' )
		tt = tt.replace( /\s{2,}/g, ' ' )
		word_A = tt.split(' ')
		step1.style.display = 'none'
		step2.style.display = null
		word_index = 0
		setup_frame_loop()
		state = 'playing'

	} else if ( state == 'playing' ){
		//console.log('play: playing nada que hacer ... ')
		return

	} else if ( state == 'paused' ){
		//console.log('play: paused, continuando ...')
		setup_frame_loop()

	}
}

function pause(){
	if ( state == 'zero'
		|| state == 'paused'
	){
		//console.log('pause: nothing to do ...')
		return

	} else if ( state == 'playing' ){
		//console.log('pause: removing frame loop ...')
		if (pid){
			clearInterval(pid); pid = 0
		}
		state = 'paused'
	}
}

function stop(){
	//console.log('stop:')
	if ( state == 'playing'
		|| state == 'paused'
	){
		//console.log('stop: removing frame loop ...')
		if (pid){
			clearInterval(pid); pid = 0
			//console.log('frame loop removed')
		}
		step2.style.display = 'none'
		step1.style.display = null
		state = 'zero'
		txt.focus()
	}
}

// associate Event Handlers
btnPlay.onclick = play
btnStop.onclick = stop
btnPause.onclick = pause

txtWaitTime.onchange = read_wait_time
txtMinCharsPerFrame.onchange = read_min_chars_per_frame

txt.focus()
//btn.focus()

</script>
</html>
